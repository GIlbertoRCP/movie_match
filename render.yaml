services:
  # Express Node.js Backend Service
  - type: web
    name: movie-match-backend
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: web
          name: movie-match-frontend
          property: host
      - key: AUTHENTIK_CLIENT_ID
        sync: false
      - key: AUTHENTIK_CLIENT_SECRET
        sync: false
      - key: AUTHENTIK_ISSUER_URL
        sync: false
      - key: AUTHENTIK_REDIRECT_URI
        sync: false

  # Vite React Frontend Static Site
  - type: web
    name: movie-match-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: movie-match-backend
          property: host
