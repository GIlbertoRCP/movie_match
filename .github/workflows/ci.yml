name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, test, build & smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Lint (oxlint)
        run: npm run lint

      - name: Check server syntax
        run: find server -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Server tests (unit + socket integration)
        run: npm test
        working-directory: server

      - name: Build frontend
        run: npm run build

      - name: Server smoke test
        working-directory: server
        env:
          PORT: 5001
        run: |
          node index.js &
          for i in $(seq 1 20); do
            curl -fsS http://localhost:5001/api/health && exit 0
            sleep 0.5
          done
          echo "Server did not become healthy" >&2
          exit 1
